aid: aeon-industrial
name: Aeon Industrial
description: >-
  Aeon Industrial is an American defense technology company, founded in 2023 and headquartered in
  the Austin, Texas area, that designs and manufactures affordable precision tactical weapon systems.
  Its two named products are ODIN, an autonomous precision targeting software package that observes,
  detects, interrogates and neutralizes threats and is advertised as an open architecture installable
  on third-party hardware, and Zeus, a modular software-defined tactical missile system powered by
  ODIN. The company is vertically integrated, building in-house from commercially available
  American-made components, and sells to U.S. and allied defense customers. Aeon publishes no public
  developer program, API, SDK or machine-readable specification; its only public machine-readable
  documents are the OpenID Connect and OAuth 2.0 discovery files served by its own WorkOS AuthKit
  identity host for its login-gated partner portal.
